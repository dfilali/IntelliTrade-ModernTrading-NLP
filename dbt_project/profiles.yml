trading_project:
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'votre-projet-gcp') }}"
      dataset: public
      keyfile: "{{ env_var('GCP_KEYFILE_PATH', 'config/gcp_service_account.json') }}"
      threads: 4
      timeout_seconds: 300
      location: EU
  target: dev
